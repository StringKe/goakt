syntax = "proto3";

package internalpb;

import "google/protobuf/duration.proto";

option go_package = "github.com/tochemey/goakt/v4/internal/internalpb;internalpb";

// ScheduledMessage is the durable delivery intent persisted for a scheduled
// message when the actor system's scheduler is configured with a persistent
// go-quartz JobQueue (see actor.WithSchedulerJobQueue). Scheduled job closures
// cannot be serialized, so instead of persisting the closure the scheduler
// persists this envelope: enough information to resolve the target actor and
// re-deliver the payload after a process restart.
message ScheduledMessage {
  // Specifies the schedule reference used to cancel, pause, or resume the
  // schedule via the ActorSystem scheduling API.
  string reference = 1;
  // Specifies the name of the actor the message is delivered to. The target
  // is resolved by name at fire time via ActorSystem.ActorOf, so delivery
  // works regardless of which process instance currently owns that name.
  string target_name = 2;
  // Specifies the name of the sender actor to resolve at fire time. Left
  // empty when the schedule was created without an explicit sender, in which
  // case the message is delivered from ActorSystem.NoSender().
  string sender_name = 3;
  // Specifies the message payload, encoded through the existing remoting
  // serialization pipeline (remote.ProtoSerializer). The encoding is
  // self-describing: it embeds the fully-qualified proto type name so the
  // payload can be decoded back into its concrete type without additional
  // out-of-band coordination.
  bytes payload = 4;
  // Specifies when the message fires.
  ScheduleTrigger trigger = 5;
}

// ScheduleTrigger describes one of the three trigger kinds supported by the
// scheduler: a one-time delay, a fixed interval, or a cron expression.
message ScheduleTrigger {
  oneof kind {
    OnceTrigger once = 1;
    IntervalTrigger interval = 2;
    CronTrigger cron = 3;
  }
}

// OnceTrigger fires exactly one time after delay has elapsed.
message OnceTrigger {
  // Specifies the delay before the message fires.
  google.protobuf.Duration delay = 1;
}

// IntervalTrigger fires repeatedly, waiting interval between deliveries.
message IntervalTrigger {
  // Specifies the fixed delay between deliveries.
  google.protobuf.Duration interval = 1;
}

// CronTrigger fires according to a cron expression evaluated in timezone.
message CronTrigger {
  // Specifies the cron expression, e.g. "0 */5 * * * *".
  string expression = 1;
  // Specifies the IANA timezone name the expression is evaluated in, e.g.
  // "America/New_York". Empty means UTC.
  string timezone = 2;
}
