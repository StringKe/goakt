syntax = "proto3";

package internalpb;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/tochemey/goakt/v4/internal/internalpb;internalpb";

// JobState enumerates the lifecycle states of a job tracked by a jobs.Store.
enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  // JOB_STATE_PENDING: enqueued and due at or after available_at, not currently leased.
  JOB_STATE_PENDING = 1;
  // JOB_STATE_LEASED: handed out by Lease to a worker, awaiting Ack/Nack before lease_expires_at.
  JOB_STATE_LEASED = 2;
  // JOB_STATE_WAITING: a fan-out parent waiting on its outstanding children to complete.
  JOB_STATE_WAITING = 3;
  // JOB_STATE_SUCCEEDED: terminal, acknowledged by its handler.
  JOB_STATE_SUCCEEDED = 4;
  // JOB_STATE_DEAD_LETTER: terminal, retries exhausted or explicitly dead-lettered.
  JOB_STATE_DEAD_LETTER = 5;
}

// BackoffKind selects the retry backoff curve applied after a Nack.
enum BackoffKind {
  BACKOFF_KIND_UNSPECIFIED = 0;
  BACKOFF_KIND_FIXED = 1;
  BACKOFF_KIND_LINEAR = 2;
  BACKOFF_KIND_EXPONENTIAL = 3;
}

// RetryPolicy configures how many times a job may be attempted and how long it
// waits between attempts after a Nack.
message RetryPolicy {
  BackoffKind kind = 1;
  // base is the fixed delay (BACKOFF_KIND_FIXED), the per-attempt increment
  // (BACKOFF_KIND_LINEAR), or the initial delay that doubles each attempt
  // (BACKOFF_KIND_EXPONENTIAL).
  google.protobuf.Duration base = 2;
  // max_delay caps the computed delay. Zero means uncapped.
  google.protobuf.Duration max_delay = 3;
  // max_attempts is the total number of delivery attempts (including the
  // first) before the job is moved to the dead-letter state. Zero is
  // rejected by jobs.NewJob; there is no "unlimited" sentinel.
  int32 max_attempts = 4;
}

// JobEnvelope is the durable, storage-agnostic representation of a job. It
// mirrors jobs.Job field-for-field and is the wire format a Store persists and
// the format fan-out children are addressed with across the cluster.
message JobEnvelope {
  string id = 1;
  string queue = 2;
  // target_name is resolved via ActorSystem.ActorOf at delivery time, so the
  // job reaches whichever PID currently answers to that name regardless of
  // which node created it.
  string target_name = 3;
  // payload is the application message, encoded through the existing remoting
  // serialization pipeline (remote.ProtoSerializer): self-describing, embeds
  // the fully-qualified proto type name.
  bytes payload = 4;
  RetryPolicy retry_policy = 5;
  int32 attempts = 6;
  JobState state = 7;
  google.protobuf.Timestamp available_at = 8;
  google.protobuf.Timestamp lease_expires_at = 9;
  string lease_owner = 10;
  string last_error = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;

  // Fan-out/fan-in linkage. child_count is set only on a fan-out parent;
  // parent_id and child_index are set only on a fan-out child.
  string parent_id = 14;
  int32 child_index = 15;
  int32 child_count = 16;
}

// JobResult is the outcome a fan-out child reports back to its parent when it
// finishes (successfully or not), used by a Store's CompleteChild to build the
// aggregated reduce-step delivery for the parent.
message JobResult {
  int32 child_index = 1;
  bytes payload = 2;
  bool failed = 3;
  string error = 4;
}

// FanInEnvelope is the message delivered to a fan-out parent's target once all
// of its children have completed: the aggregated results, ordered by
// child_index.
message FanInEnvelope {
  string job_id = 1;
  repeated JobResult results = 2;
}
